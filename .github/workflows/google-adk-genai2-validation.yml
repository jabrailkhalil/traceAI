name: Google ADK GenAI compatibility validation
on:
  push:
    branches: [validation/adk-genai2-20261018]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - adk: '1.32.0'
            genai: '1.75.0'
          - adk: '2.7.1'
            genai: '2.12.1'
          - adk: '2.12.0'
            genai: '2.31.0'
    env:
      EVIDENCE_DIR: /tmp/adk-genai2-evidence
      ADK_VERSION: ${{ matrix.adk }}
      GENAI_VERSION: ${{ matrix.genai }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ed560970f2665271e899e793c76d72cab350e07e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve, run real offline model/tool pipeline and build package
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from xml.etree import ElementTree
          
          out=Path(os.environ['EVIDENCE_DIR'])
          out.mkdir(parents=True,exist_ok=True)
          project=Path('python/frameworks/google-adk/pyproject.toml')
          adk=os.environ['ADK_VERSION']
          genai=os.environ['GENAI_VERSION']
          env={k:v for k,v in os.environ.items() if not any(s in k.upper() for s in ('TOKEN','SECRET','API_KEY','CREDENTIAL'))}
          env['PYTHONDONTWRITEBYTECODE']='1'
          def run(label,args,check=True):
              p=subprocess.run([sys.executable,'-m',*args],env=env,capture_output=True,text=True,timeout=240)
              (out/(label+'.txt')).write_text(p.stdout+p.stderr,encoding='utf-8')
              if check:
                  assert p.returncode==0,(label,p.returncode,p.stdout[-3000:],p.stderr[-3000:])
              return p
          fixed=project.read_bytes()
          original=subprocess.run(['git','show','54421a67c60c2c269df12b56720346ae54336dc8:'+project.as_posix()],capture_output=True,check=True).stdout
          requirements=['-e','python','-e','python/frameworks/google-adk','google-adk=='+adk,'google-genai=='+genai]
          try:
              project.write_bytes(original)
              before=run('original-resolution',['pip','install','--dry-run','--ignore-installed',*requirements],check=False)
          finally:
              project.write_bytes(fixed)
          if genai.startswith('2.'):
              assert before.returncode==1 and 'ResolutionImpossible' in before.stderr,(before.returncode,before.stderr[-2000:])
          else:
              assert before.returncode==0
          run('install',['pip','install',*requirements,'pytest==8.4.2','pytest-asyncio==0.26.0','black==24.10.0','ruff==0.14.1'])
          run('pip-check',['pip','check'])
          test='python/tests/test_google_adk_genai_compatibility.py'
          xml=out/'tests.xml'
          run('tests',['pytest',test,'python/tests/test_framework_google_adk.py','-q','--tb=short','--junitxml='+str(xml)])
          cases=ElementTree.parse(xml).findall('.//testcase')
          assert len(cases)==22 and not any(c.find(t) is not None for c in cases for t in ('failure','error','skipped'))
          run('ruff',['ruff','check','--isolated','--select','E4,E7,E9,F',test])
          run('black',['black','--check',test])
          run('wheel',['pip','wheel','--no-deps','--wheel-dir',str(out/'wheels'),'python/frameworks/google-adk'])
          subprocess.run(['git','diff','--exit-code'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          from importlib.metadata import version
          head=subprocess.run(['git','rev-parse','HEAD'],check=True,capture_output=True,text=True).stdout.strip()
          result={'source':head,'adk':version('google-adk'),'genai':version('google-genai'),'python':sys.version,
                  'original_resolution_exit':before.returncode,'fixed_resolution_success':True,'pip_check':True,
                  'tests':22,'failures':0,'skipped':0,'wheel_built':True,'live_provider_tested':False}
          assert result['adk']==adk and result['genai']==genai
          (out/'validated.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result,indent=2))
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adk-${{ matrix.adk }}-genai-${{ matrix.genai }}
          path: ${{ env.EVIDENCE_DIR }}
