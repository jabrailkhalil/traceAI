name: Verify refreshed Feishu regression followup
on:
  push:
    branches: [validation/qwen15518-nov10]
permissions:
  contents: read
jobs:
  feishu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      QWEN_SKIP_PREPARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jabrailkhalil/qwen-code
          ref: 4e79427e63cab1cf12b3f42cd56527c2467a2222
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Pinned source and unchanged Feishu implementation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feishu-results"
          test "$(git rev-parse HEAD)" = 4e79427e63cab1cf12b3f42cd56527c2467a2222
          test "$(git rev-parse HEAD:packages/channels/feishu/src)" = 203402dc984090ab95be54e5fee78d5f73d49078
          git log -1 --format=fuller > "$RUNNER_TEMP/feishu-results/source.txt"
          git rev-parse HEAD:packages/channels/feishu/src >> "$RUNNER_TEMP/feishu-results/source.txt"
          node --version >> "$RUNNER_TEMP/feishu-results/source.txt"
          corepack pnpm --version >> "$RUNNER_TEMP/feishu-results/source.txt"
      - name: Frozen dependency installation
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Full workspace build, bundle and typecheck
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/feishu-results/build.log"
          npm run bundle 2>&1 | tee "$RUNNER_TEMP/feishu-results/bundle.log"
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/feishu-results/typecheck.log"
      - name: Strict changed-file style and gate regression checks
        run: |
          set -euo pipefail
          files=(packages/channels/feishu/src/adapter.test.ts packages/channels/feishu/src/inbound-file-store.test.ts)
          npx --no-install eslint "${files[@]}" --max-warnings 0
          npx --no-install prettier --experimental-cli --check "${files[@]}"
          node --test .github/scripts/check-lint-gate-freshness.test.mjs scripts/tests/lint-scope.test.js > "$RUNNER_TEMP/feishu-results/gate-tests.log" 2>&1
      - name: Full Feishu suite
        working-directory: packages/channels/feishu
        run: |
          set -euo pipefail
          npx --no-install vitest run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/feishu-results/tests.json" 2>&1 | tee "$RUNNER_TEMP/feishu-results/tests.log"
      - name: Whole-cache rollback test-only A/B and restored source
        run: |
          set -euo pipefail
          result_dir="$RUNNER_TEMP/feishu-results"
          production=packages/channels/feishu/src/FeishuAdapter.ts
          tests=(packages/channels/feishu/src/adapter.test.ts packages/channels/feishu/src/inbound-file-store.test.ts)
          cp "$production" "$result_dir/FeishuAdapter.ts"
          for f in "${tests[@]}"; do cp "$f" "$result_dir/$(basename "$f")"; done
          restore() {
            cp "$result_dir/FeishuAdapter.ts" "$production"
            for f in "${tests[@]}"; do cp "$result_dir/$(basename "$f")" "$f"; done
          }
          trap restore EXIT
          python - <<'PY'
          from pathlib import Path
          p=Path('packages/channels/feishu/src/FeishuAdapter.ts')
          s=p.read_text();anchor='this.seenMessages.delete(msgId);'
          assert s.count(anchor)==1
          p.write_text(s.replace(anchor,'this.seenMessages.clear();'))
          PY
          for f in "${tests[@]}"; do git show "449b71c7b7bceceafe9052bac347fe6ffbd692dd:$f" > "$f"; done
          (cd packages/channels/feishu && npx --no-install vitest run --reporter=json --outputFile="$result_dir/base-tests-mutant.json") > "$result_dir/base-tests-mutant.log" 2>&1
          for f in "${tests[@]}"; do cp "$result_dir/$(basename "$f")" "$f"; done
          set +e
          (cd packages/channels/feishu && npx --no-install vitest run --reporter=json --outputFile="$result_dir/head-tests-mutant.json") > "$result_dir/head-tests-mutant.log" 2>&1
          mutant_exit=$?
          set -e
          test "$mutant_exit" -eq 1
          node --input-type=module - "$result_dir" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const dir=process.argv[2];
          const base=JSON.parse(fs.readFileSync(path.join(dir,'base-tests-mutant.json'),'utf8'));
          const head=JSON.parse(fs.readFileSync(path.join(dir,'head-tests-mutant.json'),'utf8'));
          assert.equal(base.numPassedTests,323);
          assert.equal(base.numFailedTests,0);
          assert.equal(head.numPassedTests,323);
          assert.equal(head.numFailedTests,1);
          const failures=head.testResults.flatMap(f=>f.assertionResults).filter(t=>t.status==='failed');
          assert.equal(failures.length,1);
          assert.equal(failures[0].fullName,'FeishuChannel inbound file dispatch cleans up after dispatch rejects without clearing another message dedup entry');
          assert.ok(failures[0].failureMessages.some(m=>m.includes('AssertionError: expected false to be true')));
          JS
          restore
          (cd packages/channels/feishu && npx --no-install vitest run --reporter=json --outputFile="$result_dir/restored.json") > "$result_dir/restored.log" 2>&1
          git diff --exit-code HEAD -- .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feishu-current-head-results
          path: ${{ runner.temp }}/feishu-results
