name: Validate native ADK replacement

on:
  push:
    branches: [validation/native-adk-nov4]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            adk: '1.2.1'
            genai: '1.75.0'
            schema: '1'
          - python: '3.12'
            adk: '2.13.0'
            genai: '2.34.0'
            schema: '1'
          - python: '3.12'
            adk: '2.13.0'
            genai: '2.34.0'
            schema: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: a9db4fff7c01d18f56c226941cf4e24c4d83ea5b
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the wheel with normal dependency resolution
        run: |
          python -m pip install 'build==1.3.0' 'pytest==8.4.2' 'pytest-asyncio==0.24.0'
          python -m build python/frameworks/google-adk --outdir "$RUNNER_TEMP/adk-dist"
          python -m pip install "$RUNNER_TEMP"/adk-dist/*.whl 'google-adk==${{ matrix.adk }}' 'google-genai==${{ matrix.genai }}'
          python -m pip check
      - name: Test native tracing and OTLP with only loopback networking
        env:
          ADK_TELEMETRY_SCHEMA_VERSION_OPT_IN: ${{ matrix.schema }}
        run: |
          sudo iptables -I OUTPUT 1 ! -o lo -j REJECT
          sudo ip6tables -I OUTPUT 1 ! -o lo -j REJECT
          trap 'sudo iptables -D OUTPUT ! -o lo -j REJECT; sudo ip6tables -D OUTPUT ! -o lo -j REJECT' EXIT
          python -I -m pytest python/frameworks/google-adk/tests -q --junitxml="$RUNNER_TEMP/native-adk.xml"
      - name: Record installed versions
        if: always()
        run: python -m pip freeze > "$RUNNER_TEMP/native-adk-freeze.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-adk-${{ matrix.python }}-${{ matrix.schema }}
          path: |
            ${{ runner.temp }}/native-adk.xml
            ${{ runner.temp }}/native-adk-freeze.txt
